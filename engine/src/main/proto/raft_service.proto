syntax = "proto3";

package aether.raft;

option java_multiple_files = true;
option java_package = "com.aether.vector.consensus.rpc.proto";
option java_outer_classname = "RaftServiceProto";

// Peer-to-peer Raft RPCs (Ongaro & Ousterhout, "In Search of an Understandable Consensus Algorithm").
service RaftService {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
}

message LogEntry {
  uint64 term = 1;
  uint64 index = 2;
  // Serialized state-machine command (e.g. an upsert or delete of a vector).
  bytes command = 3;
}

message RequestVoteRequest {
  uint64 term = 1;
  string candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesRequest {
  uint64 term = 1;
  string leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  // Hint for fast log back-tracking when success == false.
  uint64 conflict_index = 3;
}
